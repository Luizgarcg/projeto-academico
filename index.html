<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css" />
    <title>login</title>
  </head>
  <!-- O 'body' contém todo o conteúdo visível da página -->
  <body>
    
    <!-- Container principal para agrupar e estruturar todos os elementos do login -->
    <div class="container">
      <!-- Cabeçalho do card/conteúdo de login -->
      <header>
        <!-- Título principal de boas-vindas -->
         <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M320.1 32C329.1 32 337.4 37.1 341.5 45.1L415 189.3L574.9 214.7C583.8 216.1 591.2 222.4 594 231C596.8 239.6 594.5 249 588.2 255.4L473.7 369.9L499 529.8C500.4 538.7 496.7 547.7 489.4 553C482.1 558.3 472.4 559.1 464.4 555L320.1 481.6L175.8 555C167.8 559.1 158.1 558.3 150.8 553C143.5 547.7 139.8 538.8 141.2 529.8L166.4 369.9L52 255.4C45.6 249 43.4 239.6 46.2 231C49 222.4 56.3 216.1 65.3 214.7L225.2 189.3L298.8 45.1C302.9 37.1 311.2 32 320.2 32zM320.1 108.8L262.3 222C258.8 228.8 252.3 233.6 244.7 234.8L119.2 254.8L209 344.7C214.4 350.1 216.9 357.8 215.7 365.4L195.9 490.9L309.2 433.3C316 429.8 324.1 429.8 331 433.3L444.3 490.9L424.5 365.4C423.3 357.8 425.8 350.1 431.2 344.7L521 254.8L395.5 234.8C387.9 233.6 381.4 228.8 377.9 222L320.1 108.8z"/></svg>
        <h1>BEM VINDO</h1>
      </header>
      
      
      <!-- Seção usada para exibir a imagem de topo/perfil -->
      <nav>
        <!-- Imagem carregada a partir de uma URL externa -->
        <img src="https://i.pinimg.com/1200x/f7/ea/81/f7ea811d652195f3f08c29a8c7132b1f.jpg">
      </nav>
      
      <!-- Formulário de login:
           - action="pagina2.html": redireciona para esta página ao enviar
           - method="post": envia os dados do formulário no corpo da requisição (mais seguro para senhas) -->
      <form action="pagina01.html" method="get">
        
        <!-- Agrupamento do campo de e-mail -->
        <div>
          <!-- Ícone visual de perfil/rosto fornecido pelo Material Icons -->
          <i class="material-icons">face</i>

          <!-- Input para e-mail:
               - type="email": valida automaticamente se é um e-mail válido
               - name="email": identificador do dado enviado ao servidor
               - id="email": identificador único para associar ao CSS/JavaScript ou label
               - placeholder="email": texto de dica visível enquanto o campo está vazio
               - required: torna o preenchimento obrigatório antes de enviar -->
          <input type="email" name="email" id="email" placeholder="email" required/>
          
          <!-- Rótulo associado ao input de e-mail (atualmente sem texto interno) -->
          <label for="email"></label>
        </div>

        <!-- Agrupamento do campo de senha -->
        <div>
          <!-- Ícone visual de cadeado fornecido pelo Material Icons -->
          <i class="material-icons">lock</i>

          <!-- Input para senha:
               - type="password": oculta os caracteres digitados por segurança
               - name="password": identificador da senha para o backend
               - id="password": identificador único para CSS/JS/label
               - placeholder="senha": texto de dica dentro do campo
               - required: torna o preenchimento obrigatório -->
          <input type="password" name="password" id="password" placeholder="senha" required/>
          
          <!-- Rótulo associado ao input de senha (atualmente sem texto interno) -->
          <label for="password"></label>
        </div>

        <!-- Agrupamento do botão de envio -->
        <div>
          <!-- Botão para enviar o formulário:
               - class="btn": permite estilizar o botão via CSS
               - type="submit": dispara a ação do formulário ao ser clicado
               - value="Entrar": texto que aparece dentro do botão -->
          <input class="btn" type="submit" value="Entrar" />
        </div>
      </form>
    </div>



    
  </body>
</html>
