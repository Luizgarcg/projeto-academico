<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PORTAL GAMES</h1>
    <p>Tudo sobre o mundo dos jogos</p>
  </header>

  <nav class="abas">
    <button class="ativo" data-aba="noticias">Notícias</button>
    <button data-aba="reviews">Reviews</button>
  </nav>

  <nav class="categorias">
    <button class="ativo" data-cat="todas">Todas</button>
    <button data-cat="PC">PC</button>
    <button data-cat="Console">Console</button>
    <button data-cat="Mobile">Mobile</button>
  </nav>

  <main>
    <p id="contador"></p>
    <section id="lista"></section>
  </main>

  <!-- janela que abre ao clicar em uma notícia -->
  <div id="modal" class="escondido">
    <article class="conteudo">
      <button id="fechar">Fechar ✕</button>
      <span id="m-tag" class="tag"></span>
      <h2 id="m-titulo"></h2>
      <p id="m-data" class="data"></p>
      <p id="m-texto"></p>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
