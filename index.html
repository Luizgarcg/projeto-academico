<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PORTAL GAMES</h1>
    <p>Tudo sobre o mundo dos jogos</p>
  </header>

  <!-- as duas abas -->
  <nav class="abas">
    <button id="abaNoticias" class="ativo">Notícias</button>
    <button id="abaReviews">Reviews</button>
  </nav>

  <!-- as categorias -->
  <nav class="categorias">
    <button id="catTodas" class="ativo">Todas</button>
    <button id="catPC">PC</button>
    <button id="catConsole">Console</button>
    <button id="catMobile">Mobile</button>
  </nav>

  <main>
    <p id="contador"></p>
    <section id="lista"></section>
  </main>

  <!-- janela que abre ao clicar em uma notícia -->
  <div id="janela" class="escondido">
    <article class="conteudo">
      <button id="fechar">Fechar ✕</button>
      <img id="j-imagem" alt="">
      <span id="j-etiqueta" class="etiqueta"></span>
      <h2 id="j-titulo"></h2>
      <p id="j-data" class="data"></p>
      <p id="j-texto"></p>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
